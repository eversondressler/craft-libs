[package]
name = "craft-scraft-format"
description = "SoundCraft's versioned native session document model and JSON schema"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

# Outside the workspace's path dependencies on this fork branch: the other craft crates come from
# storytold at the revision SoundCraft uses, so the session types match theirs when only this crate
# is patched.
[dependencies]
craft-audio = { git = "https://github.com/storytold/craft-libs", rev = "8fa4db64a9bb943520259ea95331a303ba788f21", features = ["lossless-encode", "peaks"] }
craft-midi = { git = "https://github.com/storytold/craft-libs", rev = "8fa4db64a9bb943520259ea95331a303ba788f21", features = ["serde"] }
craft-time = { git = "https://github.com/storytold/craft-libs", rev = "8fa4db64a9bb943520259ea95331a303ba788f21" }
craft-zip = { git = "https://github.com/storytold/craft-libs", rev = "8fa4db64a9bb943520259ea95331a303ba788f21" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
craft-testkit = { workspace = true }
craft-audio = { git = "https://github.com/storytold/craft-libs", rev = "8fa4db64a9bb943520259ea95331a303ba788f21", features = ["decode", "serde"] }
proptest.workspace = true
